# Decided endgames: positions where one revealed fact settles the game.
#
# DRAFT 2026-09-27. Scored by `vgc wp benchmark` (vgc.wp.benchmark) since 2026-09-28.
#
# Each family is one position with variants that differ in a single fact. A WP model that uses
# revealed set information correctly has to:
#   1. move the right way, and a long way, when the deciding fact changes (direction);
#   2. land near `expected` in each variant (distance from truth);
#   3. with the fact hidden, land near the belief-weighted mix of the known variants (mixing);
#   4. not move at all on a fact that cannot matter (invariance — family F9).
#
# `expected` is P(we win), from the perspective side `ours`. It is a hand-reasoned draft with the
# calcs behind it written out. The eventual truth is a solver over the pinned engine, which will
# also settle what hand reasoning gets wrong: Protect stalls, crits, misses, recoil, and the
# opponent's hidden Stat Points. Every "≈1.0" below is conditional on the stated HP values, which
# were chosen so that the deciding KO lands for *any* spread they could have.
#
# Our spread is always given, because the app knows your own team exactly. Theirs is hidden in
# both regimes; only the item/ability/moves/nature are on an open sheet.
#
# `blind_spot` names an input the WP models do not have today (see PLAN-v2, the benchmark
# section). A family whose deciding fact is a blind spot cannot be passed by any current model,
# however it is trained — which is part of what the benchmark is for.
#
# Numbers: calcs are `vgc calc` against @smogon/calc 0.12.0 as pinned; Speed stats are
# `teams.sets.calc_stats`; shares are the 2026-09-20 usage report (15,028 sheets).

regulation: reg_mc
format: 1v1 and 2v2 endgames, doubles rules (spread moves hit one target when one is left)

# How a family becomes a model input (`vgc.wp.benchmark`). Each variant is built as a hand-entry
# journal — the taps a person would make — and scored through the app's own WP (`live.wp`, the
# average over opponents drawn from the belief). So a fact counts only if the app can be told it.
#
#   build.ours / build.theirs   the Pokémon left, as sets; `hp` in percent; `mega` names the forme
#   build.fainted               who else each side brought (all three have fainted by the end);
#                               default: the first three `fillers` not clashing with the family
#   build.field                 standing weather / terrain / Trick Room, with turns left
#   extra_ours                  sets for our side beyond the fillers, in team text
#   variant keys the builder reads:
#     sheets                    open: their six sheets are known; closed: six species only
#     theirs: {...}             overrides on their set (on a closed sheet, the truth, not shown)
#     ours: {...}               overrides on ours (F11's Scope Lens)
#     order: [[side, species, move], [side, species, move]]
#                               an earlier turn on which the first moved before the second
#     used: [[side, species, move]]   moves used earlier, with nothing to order them against
#     locked_into: move         their Pokémon's last move before ours came in (a choice lock)
#     reveal: [[side, species, item, value]]   an item shown (Frisk, Life Orb recoil, ...)
#     consumed: item            their Pokémon used its item up earlier
#     boosts: {stat: stages}    their Pokémon's stat stages
#     weather_turns_left / terrain_turns_left / trick_room_turns_left   override build.field
#     mix: {variant: weight}    with the fact hidden, WP should be this mix of the known variants
#     truth_as: variant         a closed-sheet variant whose evidence pins it to a known case: the
#                               solver solves that case's set, under this variant's evidence
#     faint_order: reversed     (F9) their fainted Pokémon go down in the opposite order
#
# Fillers are ours from `tests/fixtures/teams/valid_basic.txt` plus three, and serve as their
# sheets too. They faint before the position starts, so they matter only through Last Respects'
# count, Speed evidence, and F9. All are legal in Reg M-C: the first draft had a Clear Amulet
# Garchomp and an Amoonguss, neither of which is.
