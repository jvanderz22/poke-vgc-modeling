  - id: F8a
    name: Kingambit mirror, decided by Speed Stat Points
    mechanism: >
      turn order set by hidden Speed investment alone — same species, same nature. And a second
      fact in the same position: Chople Berry lets the slower one survive and win anyway.
    blind_spot: "turn-order Speed evidence — the belief channel has it; no WP model does"
    ours:
      - {species: Kingambit, item: Black Glasses, ability: Defiant, nature: Adamant,
         sp: "32 Atk / 16 Spe / 18 HP", hp: 75, moves: [Low Kick, Sucker Punch, Kowtow Cleave, Protect],
         speed: 86}
    theirs:
      - {species: Kingambit, ability: Defiant, nature: Adamant, hp: 75,
         moves_known: [Low Kick, Sucker Punch, Protect]}
    calcs:
      - "Low Kick (100 BP) vs 32 HP / 32+ Def Kingambit: 79.2–94.6%  → KOs from 75% for any spread"
      - "Low Kick vs 32 HP / 32+ Def Chople Berry Kingambit: 39.6–47.3%  → does not"
      - "Sucker Punch (Black Glasses) vs 2 HP / 0 Def Kingambit: 19.7–23.7%  → cannot decide it from 75%"
      - "Speed: ours 86. Adamant Kingambit is 70 + Spe SP, so theirs is faster from 17 Spe SP,
         tied at 16. 84% are Adamant, 14% Brave (slower still), 1% Jolly."
    variants:
      A: {sheets: open, theirs_item: Black Glasses, evidence: "earlier, their non-priority move went before ours",
          expected: 0.0, why: "they have ≥17 Spe SP; their Low Kick lands first"}
      B: {sheets: open, theirs_item: Black Glasses, evidence: "earlier, ours went before theirs",
          expected: 1.0, why: "≤15 Spe SP (a tie at 16 would have been a coin flip); our Low Kick lands first"}
      C: {sheets: open, theirs_item: Black Glasses, evidence: none, expected: from the SP prior,
          why: "P(Spe SP ≥ 17 | Adamant Kingambit), plus half the tie — the belief says how sure"}
      D: {sheets: open, theirs_item: Chople Berry, evidence: "as B (we are faster)", expected: 0.0,
          why: "our Low Kick is halved; they survive and their Low Kick KOs us"}
    note: "Low Kick is on 49% of Kingambit; the open sheet shows it here."

