  - id: F11
    name: Lost unless the crit lands
    mechanism: >
      the only way out is a critical hit, so the answer is the crit rate: 1 in 24 normally, 1 in 8
      at +1 stage (Scope Lens). A WP that says 0 here is wrong by exactly that much, and one that
      does not move between the two variants is not reading the item.
    blind_spot: "crit stage is not a model input; the item is"
    ours:
      - {species: Garchomp, item: Focus Sash, ability: Sand Veil, nature: Jolly,
         sp: "32 Atk / 32 Spe / 2 HP", hp: 25, moves: [Dragon Claw, Rock Tomb, Swords Dance, Protect],
         speed: 169}
    theirs:
      - {species: Incineroar, item: Assault Vest, ability: Intimidate, hp: 50,
         moves_known: [Knock Off, Flare Blitz, Snarl, Darkest Lariat]}
    calcs:
      - "Dragon Claw vs 32 HP / 2 Def Incineroar: 37.1–43.5%; on a crit 54.9–65.3%  → KOs from 50%
         only on a crit"
      - "Rock Tomb cannot KO from 50% even on a crit; there is no Earthquake (92–108%)"
      - "Knock Off vs our 2 HP / 0 Def Garchomp: 42.7–50.8%, Flare Blitz 26.5–31.4%  → either KOs
         ours from 25%"
      - "Speed: our Garchomp 169 > any Incineroar. Focus Sash does nothing below full HP; Sand Veil
         does nothing without sand; Fake Out fails after the first turn out"
      - "A frail Incineroar (0 HP / 0 Def) takes up to ~56% uncritted, so 'any spread' does not hold
         here; the solver's assumed spread is the bulky one"
    build:
      ours: {species: Garchomp, item: Focus Sash, ability: Sand Veil, nature: Jolly,
             sp: {hp: 2, atk: 32, spe: 32}, hp: 25, moves: [Dragon Claw, Rock Tomb, Swords Dance, Protect]}
      theirs: {species: Incineroar, item: Assault Vest, ability: Intimidate, nature: Careful, hp: 50,
               moves: [Knock Off, Flare Blitz, Snarl, Darkest Lariat]}
    variants:
      A: {sheets: open, expected: 0.042, why: "one Dragon Claw, which KOs only on a 1-in-24 crit"}
      B: {sheets: open, expected: 0.125, ours_item: Scope Lens, ours: {item: Scope Lens},
          why: "Scope Lens: +1 crit stage, 1 in 8"}
    note: >
      Protect buys nothing: they are no lower after it, and a second Protect is 1 in 3. Swords
      Dance is a turn they KO us in. So the value is the crit rate of the one Dragon Claw.

