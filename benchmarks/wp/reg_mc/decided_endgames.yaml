  - id: F4
    name: Trick Room and sun, both on a clock
    mechanism: >
      two timers, each stalled by the side it hurts. Charizard Protects to run out Trick Room;
      Tyranitar Protects to run out the sun, because out of sun Solar Beam spends a turn charging
      and Rock Slide KOs during it. Both carry Protect (100% of Charizard).
    blind_spot: >
      none for Trick Room, which has always been timed; sun turns only from featurizer version 2.
      Variants A and B are the control: a version-1 model should already get them right.
    ours:
      - {species: Tyranitar, item: Chople Berry, ability: Sand Stream, nature: Adamant,
         sp: "32 Atk / 32 HP / 2 Def", hp: 55, moves: [Rock Slide, Knock Off, Low Kick, Protect],
         speed: 81}
    theirs:
      - {species: Charizard, item: Charizardite Y, mega: true, ability: Drought, hp: 100,
         moves_known: [Solar Beam, Heat Wave, Protect]}
    field: {weather: sun}
    build:
      ours: {species: Tyranitar, item: Chople Berry, ability: Sand Stream, nature: Adamant,
             sp: {hp: 32, atk: 32, def: 2}, hp: 55, moves: [Rock Slide, Knock Off, Low Kick, Protect]}
      theirs: {species: Charizard, item: Charizardite Y, mega: Charizard-Mega-Y, ability: Drought,
               nature: Modest, hp: 100, moves: [Solar Beam, Heat Wave, Weather Ball, Protect]}
      fainted: {ours: [Rillaboom, Garchomp, Sinistcha], theirs: [Incineroar, Garchomp, Whimsicott]}
      field: {weather: Sunny Day}
    calcs:
      - "Rock Slide vs 32 HP / 32+ Def Mega Zard Y (single target): 131.8–157.8%  → OHKO"
      - "Solar Beam (sun) vs 32 HP / 32+ SpD Tyranitar: 60.8–72.4%  → KOs ours from 55%"
      - "Out of sun: Solar Beam charges for a turn; Heat Wave is resisted by Rock"
      - "Speed: any Mega Zard Y ≥ 120 > our 81"
      - "Consecutive Protect: 1/3 chance for the second, 1/9 for the third"
    variants:
      A: {sheets: open, trick_room_turns_left: 3, weather_turns_left: 5, expected: 0.9, confidence: medium,
          why: "they can Protect once; Trick Room is still up next turn, and a second Protect is 1/3"}
      B: {sheets: open, trick_room_turns_left: 1, weather_turns_left: 5, expected: 0.05, confidence: medium,
          why: "they Protect, Trick Room ends, they are faster and the sun is still up"}
      C: {sheets: open, trick_room_turns_left: 0, weather_turns_left: 1, expected: 0.85, confidence: medium,
          why: "we Protect, the sun ends, Solar Beam must charge and Rock Slide KOs during it;
                their own Protect only delays"}
      D: {sheets: open, trick_room_turns_left: 0, weather_turns_left: 4, expected: 0.05, confidence: medium,
          why: "our Protect buys one turn; the sun outlasts a second (1/3)"}
    note: >
      A/B vary only Trick Room and C/D only the sun. B and D are both "about to lose" for different
      reasons, which is the point: a model has to read the right clock. All four want the solver.

