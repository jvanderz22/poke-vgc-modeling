# Decided endgames: positions where one revealed fact settles the game.
#
# DRAFT 2026-09-27, for review. Nothing reads this yet.
#
# Each family is one position with variants that differ in a single fact. A WP model that uses
# revealed set information correctly has to:
#   1. move the right way, and a long way, when the deciding fact changes (direction);
#   2. land near `expected` in each variant (distance from truth);
#   3. with the fact hidden, land near the belief-weighted mix of the known variants (mixing);
#   4. not move at all on a fact that cannot matter (invariance — family F9).
#
# `expected` is P(we win), from the perspective side `ours`. It is a hand-reasoned draft with the
# calcs behind it written out. The eventual truth is a solver over the pinned engine, which will
# also settle what hand reasoning gets wrong: Protect stalls, crits, misses, recoil, and the
# opponent's hidden Stat Points. Every "≈1.0" below is conditional on the stated HP values, which
# were chosen so that the deciding KO lands for *any* spread they could have.
#
# Our spread is always given, because the app knows your own team exactly. Theirs is hidden in
# both regimes; only the item/ability/moves/nature are on an open sheet.
#
# `blind_spot` names an input the WP models do not have today (see PLAN-v2, the benchmark
# section). A family whose deciding fact is a blind spot cannot be passed by any current model,
# however it is trained — which is part of what the benchmark is for.
#
# Numbers: calcs are `vgc calc` against @smogon/calc 0.12.0 as pinned; Speed stats are
# `teams.sets.calc_stats`; shares are the 2026-09-20 usage report (15,028 sheets).

regulation: reg_mc
format: 1v1 and 2v2 endgames, doubles rules (spread moves hit one target when one is left)

families:

  # ---------------------------------------------------------------------------------------------
  - id: F1
    name: Scarf Basculegion against Mega Charizard Y in sun
    mechanism: speed order decided by Choice Scarf; Last Respects vs Solar Beam
    blind_spot: >
      turn-order Speed evidence (variants D, E). On a cartridge Choice Scarf is never announced;
      the only way to learn it is that Basculegion moved first, and no WP model sees turn order.
    ours:
      - {species: Charizard, item: Charizardite Y, mega: true, ability: Drought, nature: Modest,
         sp: "32 SpA / 32 Spe / 2 HP", hp: 100, moves: [Solar Beam, Heat Wave, Weather Ball, Protect],
         speed: 152}
    theirs:
      - {species: Basculegion, ability: Adaptability, hp: 60,
         moves_known: [Last Respects, Wave Crash, Aqua Jet, Protect]}
    fainted: {ours: 3, theirs: 3}
    field: {weather: sun, weather_turns_left: 4}
    calcs:
      - "Solar Beam (sun) vs 32 HP / 32+ SpD Basculegion: 66.9–79.2%  → KOs from 60% for any spread"
      - "Last Respects at 50 BP (Adamant 32 Atk Scarf) vs our 2 HP / 0 Def Zard: 45.1–54.1%;
         at 200 BP (3 allies fainted) ≈ 180–216%  → OHKO"
      - "Aqua Jet (Life Orb) vs 0 HP Zard in sun: 47.7–57.5%  → one Aqua Jet does not KO us from full"
      - "Speed: our Zard 152. Non-Scarf Basculegion max 143 (Jolly 32). Scarf Basculegion ≥ 152
         needs only 4 Spe SP (Adamant 0 Spe + Scarf = 147)."
    variants:
      A: {sheets: open, theirs_item: Life Orb, expected: 1.0,
          why: "we are faster; Solar Beam KOs; Aqua Jet first does not save them"}
      B: {sheets: open, theirs_item: Choice Scarf, expected: 0.0, confidence: high,
          why: "they are faster (any Scarf spread with ≥4 Spe SP); Last Respects KOs"}
      C: {sheets: closed, evidence: none, expected: 0.59,
          why: "mix: 41% of Basculegion carry Choice Scarf (usage), so ≈ 1 − 0.41"}
      D: {sheets: closed, expected: 0.0,
          evidence: "earlier: their Basculegion's Wave Crash went before our Timid 32-Spe Gholdengo (149)",
          why: "a non-Scarf Basculegion tops out at 143, so it is Scarf"}
      E: {sheets: closed, expected: 1.0,
          evidence: "earlier: our Zard's Heat Wave went before their Basculegion's Wave Crash",
          why: "Scarf with ≥4 Spe SP would have been faster; rules Scarf out (the SP belief says
                how sure)"}
      F: {sheets: closed, expected: 1.0,
          evidence: "Life Orb recoil seen on their Basculegion",
          why: "the item is revealed as Life Orb, so it is variant A"}

  # ---------------------------------------------------------------------------------------------
  - id: F2
    name: Choice-locked Annihilape against Gholdengo
    mechanism: which move a choice item has locked them into
    blind_spot: "choice lock — moves are featurized as an order-free set; nothing says which was last used"
    ours:
      - {species: Gholdengo, item: Life Orb, ability: Good as Gold, nature: Timid,
         sp: "32 SpA / 32 Spe / 2 HP", hp: 30, moves: [Make It Rain, Shadow Ball, Nasty Plot, Protect],
         speed: 149}
    theirs:
      - {species: Annihilape, item: Choice Scarf, ability: Defiant, hp: 100}
    calcs:
      - "Rage Fist (50 BP) vs 32 HP / 32+ Def Gholdengo: 34.0–41.2%  → KOs ours from 30%"
      - "Shadow Ball (Life Orb) vs 32 HP / 32+ SpD Annihilape: 69.5–83.8%  → guaranteed 2HKO"
      - "Speed: Scarf Annihilape ≥ 165 (Adamant, 0 Spe) > our 149"
    variants:
      A: {sheets: open, locked_into: Rage Fist, expected: 0.0,
          why: "they move first and Rage Fist KOs"}
      B: {sheets: open, locked_into: Close Combat, expected: 1.0,
          why: "Fighting cannot touch Gholdengo and they cannot switch (last Pokémon); we 2HKO"}
      C: {sheets: open, locked_into: null, expected: 0.0,
          why: "not locked yet (just came in): they choose Rage Fist — same as A"}
    note: >
      The realistic route to B is an endgame where Annihilape locked into Close Combat to KO
      something else, and Gholdengo is what is left. The pair A/B differs only in move order.

