<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VGC Companion</title>
<style>
  :root {
    --bg: #12141a; --panel: #1b1e26; --line: #2c3040; --text: #e6e8ee; --dim: #9aa1b4;
    --good: #46c07a; --warn: #e0a74a; --bad: #e06666; --accent: #6aa9ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; }
  .dim { color: var(--dim); font-size: 13px; }
  main { padding: 16px; max-width: 960px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 5px; }
  textarea { width: 100%; min-height: 150px; background: #0e1015; color: var(--text); border: 1px solid var(--line);
             border-radius: 8px; padding: 10px; font: 12px/1.45 ui-monospace, Menlo, monospace; resize: vertical; }
  button { background: var(--accent); color: #07101f; border: 0; border-radius: 8px; padding: 10px 16px;
           font-weight: 650; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .banner { border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; border: 1px solid; }
  .banner.bad  { border-color: var(--bad);  background: #2a1618; }
  .banner.warn { border-color: var(--warn); background: #2a2216; }
  .banner.ok   { border-color: var(--good); background: #14241b; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .opt:last-child { border-bottom: 0; }
  .wp { font-variant-numeric: tabular-nums; font-weight: 650; width: 58px; }
  .bar { flex: 1; height: 7px; background: #0e1015; border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .mons { font-size: 13px; }
  .leads { color: var(--dim); font-size: 12px; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); }
  .err { color: var(--bad); font-size: 13px; }
  .ok  { color: var(--good); }
</style>
</head>
<body>
<header>
  <h1>VGC Companion</h1>
  <span class="dim" id="reg">loading…</span>
</header>

<main>
  <div id="modelBanner"></div>

  <div class="panel">
    <div class="grid">
      <div>
        <label>Your team (Showdown text)</label>
        <textarea id="mine" placeholder="Paste your team…"></textarea>
        <div class="row" style="margin-top:8px">
          <button class="ghost" onclick="check('mine')">Validate</button>
          <span id="mineMsg" class="dim"></span>
        </div>
      </div>
      <div>
        <label>Opponent's open team sheet (Bo3)</label>
        <textarea id="theirs" placeholder="Paste their sheet…"></textarea>
        <div class="row" style="margin-top:8px">
          <button class="ghost" onclick="check('theirs')">Validate</button>
          <span id="theirsMsg" class="dim"></span>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <button id="go" onclick="runPreview()">Rank my brings</button>
      <span id="status" class="dim"></span>
    </div>
  </div>

  <div class="panel" id="results" style="display:none">
    <div class="row" style="justify-content:space-between">
      <strong>Best four to bring</strong>
      <span class="dim" id="baseWp"></span>
    </div>
    <div id="brings" style="margin-top:8px"></div>
    <div style="margin-top:16px">
      <strong>They are likely to bring</strong>
      <div id="theirBring" class="mons" style="margin-top:6px"></div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let REG = "reg_mc";

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

(async function init() {
  try {
    const h = await api(`/api/health?regulation=${REG}`);
    $("reg").textContent = `${h.name} · level ${h.level} · bring ${h.bring} of 6 · open sheets only`;
  } catch (e) { $("reg").textContent = "backend unreachable"; }
  try {
    const m = await api(`/api/models?regulation=${REG}`);
    showModelBanner(m);
  } catch (e) {}
})();

// The plan's rule: a model that misses a gate is not presented as calibrated. The preview gate
// is the one that says whether a ranking of bring options means anything, so it leads here.
function showModelBanner(m) {
  const d = (m.models || []).find((x) => x.version === m.default);
  if (!d) { $("modelBanner").innerHTML = `<div class="banner bad">No WP model registered.</div>`; return; }
  if (!d.evaluated) {
    $("modelBanner").innerHTML = `<div class="banner warn"><b>${d.version}</b> has not been evaluated
      — run <code>vgc wp eval</code>. Treat everything below as unverified.</div>`;
    return;
  }
  if (d.all_pass) {
    $("modelBanner").innerHTML = `<div class="banner ok"><b>${d.version}</b> passes every Phase 4 gate.</div>`;
    return;
  }
  const previewBad = d.preview_gate === false;
  $("modelBanner").innerHTML = `<div class="banner ${previewBad ? "bad" : "warn"}">
    <b>${d.version}</b> fails: ${d.failed.join(", ")}.
    ${previewBad
      ? `<b>The preview gate is one of them</b>, so this ranking is close to a guess — on teams the
         model has not seen, its ordering of bring options tracks simulated results no better than chance.
         Use it to explore, not to decide.`
      : `The failing gates are not the preview gate, but read the ranking as approximate.`}
  </div>`;
}

async function check(which) {
  const text = $(which).value.trim();
  const msg = $(which + "Msg");
  if (!text) { msg.textContent = ""; return null; }
  msg.textContent = "checking…"; msg.className = "dim";
  try {
    const r = await api("/api/validate", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ text, regulation: REG }),
    });
    const errs = (r.problems || []).filter((p) => p.severity === "error");
    if (r.legal) {
      msg.textContent = `legal · ${r.mons.length} Pokémon`; msg.className = "ok";
    } else {
      msg.innerHTML = errs.slice(0, 3).map((p) => (p.pokemon ? p.pokemon + ": " : "") + p.message).join("<br>");
      msg.className = "err";
    }
    return r;
  } catch (e) { msg.textContent = String(e.message); msg.className = "err"; return null; }
}

async function runPreview() {
  const my_team = $("mine").value.trim(), their_team = $("theirs").value.trim();
  if (!my_team || !their_team) { $("status").textContent = "both sheets are required"; return; }
  $("go").disabled = true;
  $("status").textContent = "simulating team preview…";
  try {
    const r = await api("/api/preview", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ my_team, their_team, regulation: REG, limit: 15 }),
    });
    render(r);
    $("status").textContent = `${r.n_options} options ranked by ${r.version}`;
  } catch (e) {
    $("status").innerHTML = `<span class="err">${e.message}</span>`;
  } finally { $("go").disabled = false; }
}

function render(r) {
  $("results").style.display = "";
  $("baseWp").textContent = r.preview_wp_player != null
    ? `overall WP ${(r.preview_wp_player * 100).toFixed(1)}%` : "";
  const best = r.best_by_bring || [];
  const top = best.length ? best[0].wp : 1;
  $("brings").innerHTML = best.map((o) => `
    <div class="opt">
      <span class="wp">${(o.wp * 100).toFixed(1)}%</span>
      <span class="bar"><i style="width:${Math.max(2, (o.wp / top) * 100)}%"></i></span>
      <span class="mons">${o.bring.join(", ")}<br>
        <span class="leads">lead ${o.leads.join(" + ")}</span></span>
    </div>`).join("");
  const tb = r.their_likely_bring || {};
  $("theirBring").innerHTML = Object.entries(tb).sort((a, b) => b[1] - a[1])
    .map(([s, p]) => `<span class="pill" style="margin:0 6px 6px 0">${s} ${(p * 100).toFixed(0)}%</span>`).join("");
}
</script>
</body>
</html>
